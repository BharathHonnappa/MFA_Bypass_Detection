{% extends "base.html" %}
{% block title %}Login - MFA Guard{% endblock %}
{% block content %}
<div class="auth-page">
    <section class="auth-panel">
        <div class="auth-brand"><i class="fas fa-shield-halved"></i></div>
        <h1>Sign in to MFA Guard</h1>
        <p class="muted">Enterprise post-authentication monitoring for MFA bypass detection.</p>
        {% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
        <form method="POST" action="{{ url_for('login') }}" id="loginForm">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <label class="form-label">Username</label>
            <input type="text" class="form-control" name="username" required autofocus>
            <label class="form-label mt-3">Password</label>
            <input type="password" class="form-control" name="password" required>
            <input type="hidden" name="device_fingerprint" id="deviceFingerprint">
            <button class="btn btn-primary w-100 mt-4" type="submit"><i class="fas fa-arrow-right-to-bracket"></i> Continue</button>
        </form>
    </section>
</div>
<script>
document.addEventListener('DOMContentLoaded', function() {
    const fingerprint = {
        userAgent: navigator.userAgent,
        language: navigator.language,
        platform: navigator.platform,
        screenResolution: `${screen.width}x${screen.height}`,
        timezone: Intl.DateTimeFormat().resolvedOptions().timeZone
    };
    document.getElementById('deviceFingerprint').value = JSON.stringify(fingerprint);
});
</script>
{% endblock %}
